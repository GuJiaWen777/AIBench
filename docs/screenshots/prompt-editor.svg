  <circle cx="286" cy="375" r="3.5" fill="#06b6d4"/>
  <text x="298" y="380" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#164e63">团队</text>
  <rect x="178" y="406" width="164" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="196" y="430" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">添加分类</text>
