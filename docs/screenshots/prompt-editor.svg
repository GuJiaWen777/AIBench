<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="AIBench Prompt editor screenshot">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d8dee8" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="#e7ebef"/>
  <rect width="1280" height="760" fill="url(#grid)" opacity="0.56"/>
  <rect width="1280" height="760" fill="#020617" opacity="0.42"/>
  <rect x="118" y="72" width="1044" height="616" rx="14" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/>
  <line x1="118" y1="134" x2="1162" y2="134" stroke="#cbd5e1"/>
  <text x="150" y="112" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#020617">编辑 Prompt</text>
  <rect x="956" y="91" width="72" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="992" y="113" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155">复制</text>
  <rect x="1040" y="91" width="72" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1076" y="113" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155">关闭</text>
