  <text x="178" y="246" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#334155">标题</text>
  <rect x="178" y="260" width="244" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="196" y="286" font-family="Segoe UI, sans-serif" font-size="14" fill="#0f172a">代码审查清单</text>
  <text x="178" y="346" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#334155">分类</text>
