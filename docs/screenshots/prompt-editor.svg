  <text x="198" y="516" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" letter-spacing="1" fill="#64748b">UPDATED</text>
  <text x="198" y="542" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#334155">06/18 16:48</text>
  <text x="486" y="190" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#334155">正文</text>
  <rect x="486" y="204" width="626" height="416" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="514" y="244" font-family="Consolas, monospace" font-size="15" fill="#0f172a">请以代码审查视角检查这个变更。</text>
  <text x="514" y="276" font-family="Consolas, monospace" font-size="15" fill="#0f172a">优先输出风险、回归点、遗漏测试。</text>
  <text x="514" y="308" font-family="Consolas, monospace" font-size="15" fill="#0f172a">如果没有发现问题，请明确说明。</text>
  <text x="514" y="340" font-family="Consolas, monospace" font-size="15" fill="#0f172a">请按严重程度排序，并给出文件/行号。</text>
